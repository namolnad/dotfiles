set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Prefix ---
set -g prefix C-Space
bind C-Space send-prefix

# --- General ---
set -g status-position top
set -g display-time 4000
set -g status-interval 5
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set-option -sg escape-time 0
set -s extended-keys on
set -as terminal-features 'xterm-256color:extkeys'
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin"

# --- Session switching ---
bind C-f display-popup \
  -E "tmux list-sessions -F '#{session_activity}:#{session_name}' | sort -rn | cut -d: -f2 | grep -v \"^$(tmux display-message -p '#S')\\$\" | fzf --reverse | xargs tmux switch-client -t"

# --- Project session for a directory (fzf popup over ~/Developer) ---
bind P display-popup \
  -E "find ~/Developer -mindepth 1 -maxdepth 1 -type d | sort | fzf --reverse --prompt='project> ' | xargs -r ~/.config/tmux/project.sh"

bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

bind C-t display-popup \
  -d "#{pane_current_path}" \
  -E "zsh"

# --- Window navigation ---
bind -n M-[ previous-window
bind -n M-] next-window
bind C-l last-window

# --- Splits ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Pane navigation (vim-aware) ---
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# --- Config reload ---
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Server restart (everything comes back; restart.sh --clean for a fresh start) ---
bind R confirm-before -p "Restart tmux? (y/n)" "run-shell -b '~/.config/tmux/restart.sh'"

# --- Plugins ---
# start.sh reads the saves from here too
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
# A bare nvim comes back with its session (nvim/lua/config/session.lua). The \$ is
# so resurrect's eval of this list leaves a literal end-of-line anchor.
set -g @resurrect-processes 'ngrok lazygit "~^nvim\$->nvim +SessionRestore" "~bin/dev->bin/dev" "~rails c->rails c" "~bin/kamal console->bin/kamal console"'
# Resume claude on the default model, not whichever one the session started on
set -g @assistant-resurrect-claude-drop-flags '--model'
set -g @continuum-boot 'off'
# start.sh restores a fresh server itself, so continuum only autosaves
set -g @continuum-restore 'off'
set -g @continuum-save-interval '5'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @tokyo-night-tmux_window_id_style hsquare
set -g @plugin 'janoamaral/tokyo-night-tmux'
# Last: continuum autosaves from status-right, which the theme overwrites
set -g @plugin 'tmux-plugins/tmux-continuum'

# A starting server (no sessions yet) loads plugins before it's up, since start.sh
# restores right away; a reload loads them in the background so it stays quick
if -F '#{server_sessions}' \
  "run -b '~/.config/tmux/plugins/tpm/tpm'" \
  "run '~/.config/tmux/plugins/tpm/tpm'"
