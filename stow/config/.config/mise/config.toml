# Tools mise installs and puts on PATH outside any project. Inside one, the
# project's .ruby-version, .nvmrc, .node-version, .tool-versions or mise.toml
# takes over. Missing versions install on `mise install` (run by
# `make bootstrap`/`make update`) or the first time the tool is run.
[tools]
# Exact, so every machine runs the same Ruby; ~/.default-gems goes into each one
ruby = "4.0.9"
node = "24"

[settings]
# Without this mise only honours .tool-versions and its own files, and would
# ignore the .ruby-version, .nvmrc and .node-version files projects use
idiomatic_version_file_enable_tools = ["ruby", "node"]
